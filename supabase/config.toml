# Supabase CLI configuration (local development: `supabase start`).
project_id = "kadrtop-uz"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
# Demo data only — never run these against production.
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
# Phone OTP will be enabled once a local SMS provider is integrated.
enable_signup = false

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
